name: Python analytics tests

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
